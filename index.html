<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>サイゼリヤ セルフオーダー</title>
<style>
:root{--g:#43933e;--r:#bb261a;--t:#2b2b2b;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;background:#555;font-family:"Hiragino Sans","Noto Sans JP",-apple-system,sans-serif;color:var(--t)}
#shell{max-width:430px;height:100%;margin:0 auto;background:#1c1c1e;display:flex;flex-direction:column}
.status{height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 24px 0 28px;color:#fff;font-size:17px;font-weight:600;flex:none}
.status .icons{display:flex;align-items:center;gap:5px;font-size:15px}
.camline{color:#ddd;font-size:15px;padding:2px 10px;flex:none;display:flex;align-items:center;gap:2px}
#app{flex:1;background:#fff;display:flex;flex-direction:column;position:relative;overflow:hidden;min-height:0}
header{background:var(--g);color:#fff;min-height:52px;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;padding:8px 10px;flex:none;text-align:center;line-height:1.3}
header.sm{font-size:15px;justify-content:flex-start;text-align:left}
footer{background:var(--g);color:#fff;text-align:center;font-size:15px;padding:8px;flex:none}
main{flex:1;overflow-y:auto;padding:14px 16px;position:relative;display:flex;flex-direction:column;min-height:0}
main.ctr{justify-content:center}
.gb{border:2px solid #777;border-radius:12px;background:linear-gradient(#fff 40%,#e6e6e6);color:var(--g);font-weight:700;font-family:inherit}
.red{border:1px solid #9d1d13;border-radius:10px;background:linear-gradient(#e46a62,#c52b20 45%,#b3231a);color:#fff;font-weight:700;font-family:inherit;font-size:20px;padding:12px}
.grn{border:1px solid #3d8a39;border-radius:10px;background:linear-gradient(#8fdc8d,#55b052 55%,#4a9f47);color:#fff;font-weight:700;font-family:inherit;font-size:20px;padding:12px}
.red:disabled{filter:grayscale(1);opacity:.6}
.people{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.people button{height:140px;font-size:34px}
.nav{display:flex;gap:7px;background:var(--g);padding:7px 8px 8px;flex:none;position:relative}
.nav button{flex:1;height:64px;font-size:17px;line-height:1.15;position:relative;padding:0;border:1px solid #aaa;border-radius:6px;background:linear-gradient(#fff 30%,#ddd);color:var(--g);font-weight:900;font-family:inherit;box-shadow:inset 0 -2px 0 #bbb}
.nav button.on{outline:3px solid #f0a040;outline-offset:-1px}
.bd{position:absolute;top:-8px;right:-4px;min-width:26px;height:26px;border-radius:13px;background:#e0302a;color:#fff;font-size:15px;line-height:26px;font-weight:700}
.bd.o{background:#f0a040;font-size:17px;top:-10px;right:-14px;position:absolute}
.nm{background:#e4f9e0;color:var(--g);font-size:25px;min-height:62px;padding:10px 10px;margin-top:6px;display:flex;align-items:center}
.go{display:flex;justify-content:flex-end;margin:14px 0 6px}.go button{padding:12px 18px;font-size:22px}
.code{border:3px solid var(--g);min-height:62px;display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:700;margin-bottom:10px;padding:6px}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.keys button{height:62px;font-size:44px;border-radius:12px}
.keys .del{background:linear-gradient(#8fdc8d,#55b052);color:#fff;font-size:30px;border-color:#3d8a39}
.q{display:flex;justify-content:space-between;align-items:baseline;font-size:27px}
.q b{font-weight:500;font-size:34px}
.st{display:flex;justify-content:flex-end;align-items:center;gap:14px;margin:14px 0 36px}
.st button{width:44px;height:44px;border:3px solid var(--g);border-radius:8px;background:#fff;color:var(--g);font-size:32px;line-height:30px;padding:0;font-weight:700}
.st i{font-style:normal;width:62px;height:44px;border:1px solid #ccc;text-align:center;line-height:44px;font-size:30px}
.two{display:flex;gap:16px}.two .grn{width:92px;font-size:24px;padding:12px 0}.two .red{flex:1;font-size:24px}
.cart{border:1px solid var(--g);border-radius:8px;background:#fff;flex:1;min-height:0;overflow-y:auto;padding:6px 14px}
.cart .it{padding:12px 0;font-size:26px}
.sum{display:flex;justify-content:space-between;font-size:26px;margin:14px 4px;flex:none}.sum b{font-weight:500}
.histwrap{border:1px solid var(--g);border-radius:8px;background:#f1f1f1;flex:1;min-height:0;overflow-y:auto;padding:0 16px}
.histhd{display:grid;grid-template-columns:1fr 70px 80px;background:#ccc;padding:10px 0;font-size:25px;margin:0 -16px;padding-left:16px}
.histrow{display:grid;grid-template-columns:1fr 70px 80px;align-items:center;padding:15px 0;font-size:23px;background:#fff;border-bottom:1px solid #eee;position:relative}
.histrow .reorder{position:absolute;right:-8px;top:50%;transform:translateY(-50%);background:linear-gradient(#e46a62,#b3231a);color:#fff;border-radius:16px;padding:5px 12px;font-size:16px;font-weight:700;border:1px solid #9d1d13}
.note{color:var(--g);font-size:19px;margin:10px 2px}
.pop{position:absolute;left:5%;right:5%;top:30%;background:#fff;border-radius:10px;padding:22px 24px 20px;box-shadow:0 2px 16px rgba(0,0,0,.4);z-index:50;font-size:25px;line-height:1.5;border:1px solid #ddd}
.pop:after{content:'';position:absolute;top:-10px;right:30px;border:10px solid transparent;border-bottom-color:#fff}
.pop h4{color:var(--g);font-size:23px;margin:0 0 10px}
.pop .bt{display:flex;justify-content:flex-end;gap:18px;margin-top:18px}
.pop .bt button{font-family:inherit;font-size:21px;padding:9px 26px;border-radius:5px;border:1px solid #bbb;background:#eee;color:#444}
.pop .bt button.y{border:2px solid #4a9eea;background:#fff;color:#222}
.pop .bt button.ok{border:1px solid #bbb;background:#eee;color:#222;margin-left:auto}
.msg{font-size:34px;line-height:1.5}.msg p{margin:0 0 28px}
.call{display:flex;flex-direction:column;gap:56px}
.call button{height:100px;width:100%;font-size:34px;text-align:left;padding:0 36px;display:flex;align-items:center;gap:20px;font-weight:500}
.call .gy{border:2px solid #777;background:linear-gradient(#ccc,#a5a5a5);color:#ddd;border-radius:10px}
.call .gy.act{background:linear-gradient(#8fdc8d,#55b052);color:#fff;border-color:#3d8a39}
.lang{position:absolute;right:20px;top:20px;text-align:center;color:#7ab648;font-weight:700;font-size:17px}
.dim{filter:blur(.3px) brightness(.97)}
</style></head><body><div id="shell">
<div id="app"></div>
<script>
const M={

};
const S={s:'start',n:0,code:'',qty:1,cart:[],sent:[],pop:'warn',delIdx:null,ord:72,cam:false};
const $=document.getElementById('app');
function statusbar(){}

const tot=l=>l.reduce((a,i)=>a+M[i.c][1]*i.q,0),cnt=l=>l.reduce((a,i)=>a+i.q,0);
const hist=()=>agg(S.sent);
const later=()=>S.sent.some(i=>i.c=='3205'||i.c=='3206'||i.c=='3201'||i.c=='3207'||i.c=='3213'||i.c=='3215'||i.c=='3214'||i.c=='3212'||i.c=='3216');

return `<div class=nav>${t.map(([k,l])=>`<button class="${a==k||(a=='qty'&&k=='order')?'on':''}" onclick="go('${k}')">${l}${k=='cart'&&S.cart.length?`<span class=bd>${cnt(S.cart)}</span>`:''}${k=='bill'&&S.sent.length?`<span class="bd o">!</span>`:''}</button>`).join('')}</div>`}

function draw(){const s=S.s;let h='';
if(s=='start')h=`<header>いらっしゃいませ</header><main class=ctr><div class=lang><svg width=48 height=48 viewBox="0 0 48 48" fill="none" stroke="#7ab648" stroke-width="3"><circle cx=24 cy=24 r=21 /><ellipse cx=24 cy=24 rx=9 ry=21 /><path d="M3 24h42M7 14h34M7 34h34"/></svg><br>Language</div><div style="text-align:center">${logo(220)}<div style="font-size:18px;color:#c33;margin-top:4px">イタリアンワイン＆カフェレストラン</div><div style="font-size:46px;font-weight:900;color:#d12a1f;line-height:1.1;margin-bottom:22px">サイゼリヤ</div></div><button class=red style="width:100%;font-size:30px;padding:16px 0;font-weight:500" onclick="go('ppl')">注文をはじめる</button></main><footer>©2023 Saizeriya Co,. Ltd. All rights reserved.</footer>${S.pop=='warn'?`<div class=pop style="top:20%"><h4>これは本物の注文システムではありません</h4>個人が作成した非公式のデモ画面です。実際の店舗の公式アプリ・端末ではなく、注文や決済は一切行われません。<div class=bt><button class=ok onclick="S.pop=null;draw()">了解しました</button></div></div>`:''}`;
else if(s=='ppl')h=`<header>何名様(全員)でご利用ですか？</header><main class=ctr><div class=people>${[1,2,3,4,5,6,7,8].map(n=>`<button class=gb onclick="askPpl(${n})">${n}人</button>`).join('')}<button class=gb onclick="askPpl('9人以上')">9人<br>以上</button></div>${S.pop=='ppl'?`<div class=pop>${S.n}名様でご利用ですね？<div class=bt><button onclick="S.pop=null;draw()">いいえ</button><button class=y onclick="go('order')">はい</button></div></div>`:''}</main>${nav('')}`;

${S.pop=='notfound'?`<div class=pop>この番号のメニューが見つかりません。<br>メニュー番号をお確かめください。<div class=bt><button class=ok onclick="S.code='';S.pop=null;draw()">OK</button></div></div>`:''}
${S.pop=='alc'?`<div class=pop><h4>アルコール販売についてのご確認</h4>20歳未満のお客様、およびお車や自転車などを運転されるお客様へのアルコール販売をお断りしております。<div class=bt><button onclick="S.code='';S.pop=null;draw()">もどる</button><button class=y onclick="S.pop=null;go('qty')">確認</button></div></div>`:''}
</main>${nav('order')}`}
else if(s=='qty'){const it=M[S.code];h=`<header>数量を選択してください</header><main class=ctr><div class=q><span>${it[0]}</span><b>${it[1]}円</b></div><div class=st><button onclick="S.qty=Math.max(1,S.qty-1);draw()">−</button><i>${S.qty}</i><button onclick="S.qty=Math.min(99,S.qty+1);draw()">+</button></div><div class=two><button class=grn onclick="go('order')">もどる</button><button class=red onclick="S.cart.push({c:S.code,q:S.qty});go('cart')">注文かごへ追加する</button></div></main>${nav('qty')}`}

<div class=histwrap><div class=histhd><span>メニュー名</span><span>数量</span><span>価格</span></div>${l.map(i=>`<div class=histrow><span>${M[i.c][0]}</span><span style="text-align:center">${i.q}</span><span style="text-align:right">${M[i.c][1]*i.q}</span></div>`).join('')}</div>
